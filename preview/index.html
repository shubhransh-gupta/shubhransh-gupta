<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>README Preview — Frontier AI Era</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #030712;
      color: #e0e7ff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    .preview-banner {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(90deg, #090D16, #00F5FF, #8B5CF6, #090D16);
      color: #030712;
      text-align: center;
      padding: 10px 16px;
      font-family: "Fira Code", monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      border-bottom: 2px solid #00F5FF;
      box-shadow: 0 0 20px rgba(0, 245, 255, 0.4);
    }
    .profile-shell {
      max-width: 1012px;
      margin: 0 auto;
      padding: 32px 16px 64px;
    }
    .profile-card {
      border: 1px solid #1e293b;
      border-radius: 12px;
      background: #090d16;
      padding: 36px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }
    .markdown-body h2 {
      border-bottom: 1px solid #1e293b;
      padding-bottom: 0.4em;
      color: #00F5FF;
      font-size: 1.4em;
      margin-top: 32px;
      margin-bottom: 16px;
      font-family: 'Fira Code', monospace;
    }
    .markdown-body pre {
      background: #050811;
      border: 1px solid #1e293b;
      border-left: 3px solid #00F5FF;
      border-radius: 8px;
      padding: 18px;
      overflow: auto;
    }
    .markdown-body pre code {
      color: #00FF9D;
      font-family: 'Fira Code', monospace;
      font-size: 13px;
    }
    .markdown-body blockquote {
      border-left: 3px solid #8B5CF6;
      background: rgba(139, 92, 246, 0.05);
      padding: 14px 18px;
      color: #cbd5e1;
      margin: 20px 0;
      border-radius: 0 8px 8px 0;
    }
    .markdown-body hr {
      border: none;
      border-top: 1px solid #1e293b;
      margin: 28px 0;
    }
    .markdown-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 20px 0;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid #1e293b;
      padding: 12px 14px;
    }
    .markdown-body th {
      background: #0f172a;
      color: #00F5FF;
    }
    .markdown-body img { max-width: 100%; }
    .markdown-body a { color: #00F5FF; text-decoration: none; }
    .markdown-body a:hover { text-decoration: underline; color: #8B5CF6; }
    .center { text-align: center; }
  </style>
</head>
<body>
  <div class="preview-banner">⚡ FRONTIER AI ERA — LOCAL README PREVIEW</div>

  <div class="profile-shell">
    <div class="profile-card markdown-body">
      <div id="readme-container">
        <!-- Rendered live via iframe or markdown -->
        <p class="center" style="color: #94a3b8; font-family: 'Fira Code', monospace;">
          Loading telemetry stream...
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch('../README.md')
      .then(res => res.text())
      .then(md => {
        document.getElementById('readme-container').innerHTML = marked.parse(md);
      })
      .catch(err => {
        document.getElementById('readme-container').innerHTML = '<p>Error loading README: ' + err + '</p>';
      });
  </script>
</body>
</html>
