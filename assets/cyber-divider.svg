<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 20" width="100%" height="20" fill="none">
  <defs>
    <linearGradient id="cyber-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="1"/>
      <stop offset="85%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse-flare" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#00F5FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes sweep {
      0% { transform: translateX(-350px); }
      100% { transform: translateX(1200px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .sweep-flare { animation: sweep 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .pulse-node { animation: pulse 2.2s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Ambient background line -->
  <line x1="0" y1="10" x2="1200" y2="10" stroke="#1E293B" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Glowing laser track -->
  <line x1="60" y1="10" x2="1140" y2="10" stroke="url(#cyber-beam)" stroke-width="2" filter="url(#glow)"/>
  <line x1="120" y1="10" x2="1080" y2="10" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.9"/>

  <!-- Neural Nodes -->
  <circle cx="600" cy="10" r="5" fill="#00F5FF" filter="url(#glow)" class="pulse-node"/>
  <circle cx="600" cy="10" r="2.5" fill="#FFFFFF"/>
  <polygon points="596,10 600,6 604,10 600,14" fill="#8B5CF6" opacity="0.8"/>

  <circle cx="360" cy="10" r="3.5" fill="#8B5CF6" filter="url(#glow)" class="pulse-node"/>
  <circle cx="360" cy="10" r="1.5" fill="#FFFFFF"/>

  <circle cx="840" cy="10" r="3.5" fill="#00F5FF" filter="url(#glow)" class="pulse-node"/>
  <circle cx="840" cy="10" r="1.5" fill="#FFFFFF"/>

  <!-- Scanning Flare -->
  <g class="sweep-flare">
    <ellipse cx="150" cy="10" rx="120" ry="3" fill="url(#pulse-flare)" filter="url(#glow)"/>
  </g>
</svg>
