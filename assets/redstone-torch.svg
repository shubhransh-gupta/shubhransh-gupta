<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" role="img" aria-label="Redstone torch pulse">
  <style>
    @keyframes pulse {
      0%, 100% { fill: #AA0000; filter: drop-shadow(0 0 2px #FF0000); }
      50% { fill: #FF3333; filter: drop-shadow(0 0 8px #FF5555); }
    }
    .flame { animation: pulse 1s ease-in-out infinite; }
  </style>
  <rect width="48" height="64" fill="transparent"/>
  <rect x="21" y="28" width="6" height="28" fill="#8B4513"/>
  <rect x="18" y="24" width="12" height="6" fill="#666"/>
  <rect class="flame" x="16" y="8" width="16" height="16" rx="2"/>
  <rect x="20" y="12" width="8" height="8" fill="#FF6666" opacity="0.8"/>
</svg>
