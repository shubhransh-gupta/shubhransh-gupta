name: Generate Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: shubhransh-gupta
          options: theme=react-dark&bg_color=090D16&color=00F5FF&line=8B5CF6&point=00FF9D&area=true&hide_border=false&border=00F5FF&radius=8&custom_title=NEURAL%20COMPUTE%20%26%20CONTRIBUTION%20TELEMETRY&custom_title_color=00F5FF
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy activity graph to assets
        run: |
          mkdir -p assets
          if [ -f dist/activity-graph.svg ]; then
            cp dist/activity-graph.svg assets/activity-graph.svg
          fi

      - name: Commit activity graph SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update activity graph"
          file_pattern: assets/activity-graph.svg
