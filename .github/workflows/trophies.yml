name: Update GitHub Profile Trophies

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Profile Trophies
        run: |
          mkdir -p assets
          curl -s "https://github-profile-trophy-gamma.vercel.app/?username=shubhransh-gupta&theme=onedark&column=7&no-frame=false&no-bg=false&margin-w=4&margin-h=4" > assets/github-profile-trophies.svg

      - name: Commit Trophies SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update github profile trophies"
          file_pattern: assets/github-profile-trophies.svg
